[project]
name = "diag-author"
version = "0.1.0"
description = "오프라인 ECU 진단 데이터 작성 도구"
requires-python = ">=3.13,<3.14"
dependencies = ["PySide6==6.11.2", "lxml==6.0.2"]

[project.gui-scripts]
diag-author = "diagstudio.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
diagstudio = ["schema.sql"]

[tool.pyside6-project]
files = ["main.py", "diagstudio/__init__.py", "diagstudio/main.py", "diagstudio/domain.py", "diagstudio/persistence.py", "diagstudio/application.py", "diagstudio/interchange.py", "diagstudio/cdd_model.py", "diagstudio/migrations.py", "diagstudio/presentation.py", "diagstudio/workers.py", "diagstudio/dialogs.py", "diagstudio/overviews.py", "diagstudio/comparison.py", "diagstudio/layout_view.py", "diagstudio/source_views.py", "diagstudio/pages.py", "diagstudio/panels.py", "diagstudio/tools.py", "diagstudio/compare_view.py", "diagstudio/cell_edit.py", "diagstudio/find_dialog.py", "diagstudio/ui.py"]
